name: Build & Release

on:
  push:
    branches:
      - main        # se ejecuta al hacer push a main
    tags:
      - 'v*.*.*'    # se ejecuta al crear un tag con formato v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Descargar el repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Compilar y empaquetar con Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4️⃣ Crear release automáticamente
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5️⃣ Subir JAR como asset de la release
      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
